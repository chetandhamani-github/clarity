server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

clarity:
  admin:
    secret-key: ${ADMIN_SECRET_KEY:}
  auth:
    allow-unverified-fallback: ${AUTH_ALLOW_UNVERIFIED_FALLBACK:false}
    google-client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    require-client-identity: ${REQUIRE_CLIENT_IDENTITY:true}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}

spring:
  application:
    name: clarity-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clarity_db}
    username: ${DB_USERNAME:clarity_user}
    password: ${DB_PASSWORD:clarity_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 30000
      pool-name: ClarityHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
