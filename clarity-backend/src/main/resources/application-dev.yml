clarity:
  admin:
    secret-key: ${ADMIN_SECRET_KEY:clarity-admin-2026}
  auth:
    allow-unverified-fallback: ${AUTH_ALLOW_UNVERIFIED_FALLBACK:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
