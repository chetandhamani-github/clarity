clarity:
  admin:
    secret-key: ${ADMIN_SECRET_KEY:clarity-admin-2026}
  auth:
    allow-unverified-fallback: ${AUTH_ALLOW_UNVERIFIED_FALLBACK:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/clarity_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
