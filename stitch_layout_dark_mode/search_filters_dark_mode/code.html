<!DOCTYPE html>

<style>
        body { font-family: 'Manrope', sans-serif; }
        .glass-panel {
            background-color: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Custom scrollbar for a cleaner look in dark mode */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3939; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container pb-stack-lg">
<!-- TopAppBar from JSON -->
<header class="w-full top-0 sticky z-50 bg-background glass-panel">
<div class="flex justify-between items-center px-margin-mobile md:px-gutter py-4 max-w-7xl mx-auto border-b border-border-subtle/50 md:border-none">
<div class="flex items-center gap-4">
<!-- Leading Back button since it's a sub-page/search screen -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant hover:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md md:text-display-lg font-display-lg text-primary tracking-tighter">Clarity</h1>
</div>
<button aria-label="Notifications" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile md:px-0 pt-stack-md flex flex-col gap-stack-lg">
<!-- Search Input Section -->
<section class="flex flex-col gap-base">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Search Transactions</h2>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary transition-colors">search</span>
</div>
<input class="w-full bg-[#0f0f0f] border border-border-subtle rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-on-surface-variant/50" placeholder="Search merchants, categories, or amounts..." type="text" value="Uber"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">cancel</span>
</button>
</div>
</section>
<!-- Filters Grid -->
<section class="bg-surface border border-border-subtle rounded-2xl p-6 flex flex-col gap-stack-md">
<div class="flex justify-between items-center border-b border-border-subtle pb-4">
<h3 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Active Filters</h3>
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors">Clear All</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Date Range -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Date Range</label>
<div class="flex gap-2">
<button class="flex-1 bg-surface-container-high hover:bg-surface-bright border border-border-subtle rounded-lg py-2 px-3 text-left flex justify-between items-center transition-colors">
<span class="font-body-md text-body-md text-on-surface">Oct 1, 2023</span>
<span class="material-symbols-outlined text-[16px] text-secondary">calendar_today</span>
</button>
<span class="flex items-center text-secondary">-</span>
<button class="flex-1 bg-surface-container-high hover:bg-surface-bright border border-border-subtle rounded-lg py-2 px-3 text-left flex justify-between items-center transition-colors">
<span class="font-body-md text-body-md text-on-surface">Oct 31, 2023</span>
<span class="material-symbols-outlined text-[16px] text-secondary">calendar_today</span>
</button>
</div>
</div>
<!-- Account -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Account</label>
<button class="w-full bg-surface-container-high hover:bg-surface-bright border border-border-subtle rounded-lg py-2 px-3 text-left flex justify-between items-center transition-colors">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-body-md text-body-md text-on-surface">Platinum Reserve (...4092)</span>
</div>
<span class="material-symbols-outlined text-[18px] text-secondary">expand_more</span>
</button>
</div>
<!-- Categories Quick Select -->
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Categories</label>
<div class="flex flex-wrap gap-2">
<button class="bg-[#242424] border border-primary/50 text-primary font-label-md text-label-md px-4 py-2 rounded-full transition-colors flex items-center gap-1">
                            Transportation
                            <span class="material-symbols-outlined text-[14px]">close</span>
</button>
<button class="bg-surface-container-high border border-border-subtle text-on-surface-variant hover:text-on-surface hover:border-outline font-label-md text-label-md px-4 py-2 rounded-full transition-colors">
                            Dining
                        </button>
<button class="bg-surface-container-high border border-border-subtle text-on-surface-variant hover:text-on-surface hover:border-outline font-label-md text-label-md px-4 py-2 rounded-full transition-colors">
                            Travel
                        </button>
<button class="bg-surface-container-high border border-border-subtle text-on-surface-variant hover:text-on-surface hover:border-outline font-label-md text-label-md px-4 py-2 rounded-full transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            More
                        </button>
</div>
</div>
</div>
<div class="pt-4 border-t border-border-subtle flex justify-end">
<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-2.5 rounded-lg hover:bg-primary-fixed transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">filter_list</span>
                    Apply Filters
                </button>
</div>
</section>
<!-- Search Results List -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Results</h3>
<span class="font-body-md text-body-md text-on-surface-variant">3 matches found</span>
</div>
<div class="flex flex-col gap-2">
<!-- Transaction Row 1 -->
<div class="bg-surface border border-border-subtle rounded-xl p-4 flex items-center justify-between hover:bg-[#242424] transition-colors cursor-pointer group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-highest border border-border-subtle flex items-center justify-center text-on-surface group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined">directions_car</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Uber Rides</span>
<span class="font-body-md text-body-md text-secondary">Oct 24 • Transportation</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">-$24.50</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Platinum ...4092</span>
</div>
</div>
<!-- Transaction Row 2 -->
<div class="bg-surface border border-border-subtle rounded-xl p-4 flex items-center justify-between hover:bg-[#242424] transition-colors cursor-pointer group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-highest border border-border-subtle flex items-center justify-center text-on-surface group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined">local_dining</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Uber Eats</span>
<span class="font-body-md text-body-md text-secondary">Oct 22 • Dining</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">-$42.10</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Platinum ...4092</span>
</div>
</div>
<!-- Transaction Row 3 -->
<div class="bg-surface border border-border-subtle rounded-xl p-4 flex items-center justify-between hover:bg-[#242424] transition-colors cursor-pointer group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-highest border border-border-subtle flex items-center justify-center text-on-surface group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined">directions_car</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Uber Rides</span>
<span class="font-body-md text-body-md text-secondary">Oct 18 • Transportation</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">-$18.90</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Platinum ...4092</span>
</div>
</div>
</div>
</section>
</main>
</body></html>
