<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #454747;
        }
        
        /* Custom form focus styles */
        .premium-input:focus {
            border-color: #f7bd48 !important;
            box-shadow: none !important;
        }
        
        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f7bd48;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #f7bd48;
        }
        
        /* Date picker icon inversion */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen font-body-md antialiased flex flex-col md:items-center">
<!-- TopAppBar Container -->
<div class="w-full top-0 sticky z-40 bg-background dark:bg-background border-b border-border-subtle dark:border-border-subtle flex items-center justify-between px-margin-mobile h-touch-target">
<button aria-label="Go Back" class="flex items-center justify-center w-touch-target h-touch-target hover:bg-surface-container dark:hover:bg-surface-container transition-colors active:scale-95 duration-200 rounded-full" type="button">
<span class="material-symbols-outlined text-primary dark:text-primary">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold tracking-tight">Add Transaction</h1>
<div class="w-touch-target h-touch-target flex items-center justify-center">
<!-- Empty placeholder to balance flex-between -->
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] px-margin-mobile py-stack-lg md:py-12 flex flex-col gap-stack-lg">
<form class="flex flex-col gap-stack-lg w-full">
<!-- Amount Card -->
<div class="bg-surface border border-border-subtle rounded-xl p-6 flex flex-col items-center justify-center gap-2">
<label class="font-label-md text-label-md text-secondary" for="amount">Amount</label>
<div class="flex items-center gap-2">
<span class="font-display-lg text-display-lg text-on-surface">$</span>
<input autofocus="" class="premium-input bg-transparent border-none text-center font-display-lg text-display-lg text-on-surface p-0 focus:ring-0 w-[180px] placeholder:text-secondary-container" id="amount" name="amount" placeholder="0.00" required="" step="0.01" type="number"/>
</div>
</div>
<!-- Details Section -->
<div class="flex flex-col gap-stack-md">
<!-- Merchant / Description -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-tertiary px-1" for="description">Merchant / Description</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary z-10 pointer-events-none">storefront</span>
<input class="premium-input w-full bg-background border border-border-subtle rounded-lg py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-0 transition-colors" id="description" name="description" placeholder="Where did you spend?" type="text"/>
</div>
</div>
<!-- Category & Account Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Category -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-tertiary px-1" for="category">Category</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary z-10 pointer-events-none">category</span>
<select class="premium-input w-full bg-background border border-border-subtle rounded-lg py-3 pl-12 pr-10 font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:ring-0 transition-colors" id="category" name="category">
<option disabled="" selected="" value="">Select Category</option>
<option value="dining">Dining &amp; Drinks</option>
<option value="groceries">Groceries</option>
<option value="transport">Transportation</option>
<option value="shopping">Shopping</option>
<option value="entertainment">Entertainment</option>
<option value="utilities">Utilities</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Account -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-tertiary px-1" for="account">Account</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary z-10 pointer-events-none">account_balance_wallet</span>
<select class="premium-input w-full bg-background border border-border-subtle rounded-lg py-3 pl-12 pr-10 font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:ring-0 transition-colors" id="account" name="account">
<option selected="" value="checking">Main Checking (....4829)</option>
<option value="savings">High Yield Savings (....1192)</option>
<option value="credit">Platinum Credit (....9934)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-tertiary px-1" for="date">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary z-10 pointer-events-none">calendar_today</span>
<input class="premium-input w-full bg-background border border-border-subtle rounded-lg py-3 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-0 transition-colors" id="date" name="date" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Recurring Toggle -->
<div class="bg-surface border border-border-subtle rounded-xl p-4 flex items-center justify-between mt-2">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium">Recurring Transaction</span>
<span class="font-body-md text-body-md text-secondary">Repeat this expense monthly</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-on-surface border-4 border-surface appearance-none cursor-pointer transition-all duration-300 z-10" id="recurring-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-high cursor-pointer transition-colors duration-300" for="recurring-toggle"></label>
</div>
</div>
<!-- Action Button -->
<div class="mt-stack-lg pb-stack-lg">
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl hover:bg-primary-fixed-dim transition-colors active:scale-[0.98] duration-200 shadow-[0_0_15px_rgba(247,189,72,0.1)] hover:shadow-[0_0_20px_rgba(247,189,72,0.2)]" type="submit">
                    Save Transaction
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Suppressed as this is a transactional flow -->
</body></html>
