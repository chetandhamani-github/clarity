<!-- Subtle internal gradient/glow -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-high/20 to-transparent pointer-events-none rounded-xl"></div>
<!-- Illustration / Icon Container -->
<div class="w-32 h-32 mb-8 relative flex items-center justify-center">

<div class="absolute inset-0 bg-primary/5 rounded-full blur-xl transition-all duration-700 group-hover:bg-primary/10"></div>
<div class="w-24 h-24 rounded-full border border-primary/20 flex items-center justify-center bg-surface-container relative z-10">
<span class="material-symbols-outlined text-primary text-5xl font-light" style="font-variation-settings: 'wght' 200;">

                    </span>
</div>
</div>
<!-- Copy -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-4">Welcome to Clarity</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-xs">

            </p>
