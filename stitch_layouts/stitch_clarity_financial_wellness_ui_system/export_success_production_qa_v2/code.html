<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F7F6F2; /* Design System Level 0 */
        }
        
        /* Scrim Overlay */
        .scrim-overlay {
            background-color: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Custom Radio Styles */
        .custom-radio {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #817563; /* outline */
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .custom-radio:checked {
            border-color: #785600; /* primary */
        }

        .custom-radio:checked::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #785600;
            border-radius: 50%;
            position: absolute;
        }

        .export-option-card {
            transition: all 0.2s ease;
        }
        
        .export-option-card:has(input:checked) {
            border-color: #785600;
            background-color: #fefcf8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased text-on-surface min-h-screen flex items-center justify-center">
<!-- Mock Background Content to show Scrim Effect -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
<div class="max-w-7xl mx-auto p-8 grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="bg-white p-6 rounded-2xl border border-outline-variant h-64"></div>
<div class="bg-white p-6 rounded-2xl border border-outline-variant h-64 col-span-2"></div>
<div class="bg-white p-6 rounded-2xl border border-outline-variant h-96 col-span-3"></div>
</div>
</div>
<!-- The Scrim -->
<div class="fixed inset-0 z-40 scrim-overlay flex items-end sm:items-center justify-center sm:p-6" id="modal-container">
<!-- View 1: Export Options Modal -->
<div class="bg-surface rounded-t-2xl sm:rounded-2xl shadow-[0_8px_24px_rgba(26,26,26,0.04)] w-full max-w-md border-t sm:border border-outline-variant overflow-hidden transform transition-all duration-300 opacity-100 scale-100 relative z-50 flex flex-col" id="export-view">
<!-- Modal Header -->
<div class="flex items-center justify-between px-margin-mobile py-stack-md border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-on-surface">Export Report</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center w-12 h-12 -mr-3 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-margin-mobile flex-1 overflow-y-auto">
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">Select a format to download your customized financial summary.</p>
<form class="space-y-stack-md" id="export-form">
<!-- Option 1: PDF -->
<label class="export-option-card flex items-center p-stack-md border border-outline-variant rounded-2xl cursor-pointer hover:bg-surface-container">
<input checked="" class="custom-radio mr-stack-md" name="export_format" type="radio" value="pdf"/>
<div class="flex-1">
<span class="block font-headline-sm text-headline-sm text-on-surface">PDF Document</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-stack-sm">Best for printing and sharing</span>
</div>
<span class="material-symbols-outlined text-secondary ml-stack-md" style="font-variation-settings: 'FILL' 0;">picture_as_pdf</span>
</label>
<!-- Option 2: CSV -->
<label class="export-option-card flex items-center p-stack-md border border-outline-variant rounded-2xl cursor-pointer hover:bg-surface-container">
<input class="custom-radio mr-stack-md" name="export_format" type="radio" value="csv"/>
<div class="flex-1">
<span class="block font-headline-sm text-headline-sm text-on-surface">CSV Spreadsheet</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-stack-sm">Raw data for Excel or Numbers</span>
</div>
<span class="material-symbols-outlined text-secondary ml-stack-md" style="font-variation-settings: 'FILL' 0;">table_chart</span>
</label>
<!-- Option 3: JSON -->
<label class="export-option-card flex items-center p-stack-md border border-outline-variant rounded-2xl cursor-pointer hover:bg-surface-container">
<input class="custom-radio mr-stack-md" name="export_format" type="radio" value="json"/>
<div class="flex-1">
<span class="block font-headline-sm text-headline-sm text-on-surface">JSON Data</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-stack-sm">Structured data for developers</span>
</div>
<span class="material-symbols-outlined text-secondary ml-stack-md" style="font-variation-settings: 'FILL' 0;">data_object</span>
</label>
</form>
</div>
<!-- Modal Footer -->
<div class="p-margin-mobile pt-0 flex gap-stack-md">
<button class="flex-1 py-3 px-4 font-label-md text-label-md border border-outline text-on-surface rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center" type="button">Cancel</button>
<button class="flex-1 py-3 px-4 font-label-md text-label-md bg-primary text-on-primary rounded-full hover:bg-surface-tint transition-colors flex items-center justify-center" id="btn-export" type="button">Export Now</button>
</div>
</div>
<!-- View 2: Success State (Hidden initially) -->
<div class="bg-surface rounded-t-2xl sm:rounded-2xl shadow-[0_8px_24px_rgba(26,26,26,0.04)] w-full max-w-sm border-t sm:border border-outline-variant p-stack-lg text-center hidden transform transition-all duration-300 opacity-0 scale-95 relative z-50 mb-auto sm:mb-0 mt-auto sm:mt-0" id="success-view">
<div class="flex justify-center mb-stack-md">
<!-- Large Checkmark in Primary -->
<div class="w-16 h-16 rounded-full flex items-center justify-center bg-primary-container">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Export Successful</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">
                Your financial report has been exported successfully and is ready for download.
            </p>
<button class="w-full py-3 px-4 font-label-md text-label-md bg-primary text-on-primary rounded-full hover:bg-surface-tint transition-colors flex items-center justify-center" id="btn-return" type="button">
                Return to Dashboard
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnExport = document.getElementById('btn-export');
            const btnReturn = document.getElementById('btn-return');
            const exportView = document.getElementById('export-view');
            const successView = document.getElementById('success-view');

            // Simulate Export Process
            btnExport.addEventListener('click', () => {
                // Add a subtle loading state to button (optional enhancement)
                btnExport.innerHTML = '<span class="material-symbols-outlined animate-spin mr-base text-[20px]">progress_activity</span> Exporting...';
                btnExport.style.opacity = '0.8';
                btnExport.disabled = true;

                setTimeout(() => {
                    // Hide Export View
                    exportView.classList.remove('opacity-100', 'scale-100');
                    exportView.classList.add('opacity-0', 'scale-95');
                    
                    setTimeout(() => {
                        exportView.classList.add('hidden');
                        
                        // Show Success View
                        successView.classList.remove('hidden');
                        // Small delay to allow display:block to apply before animating opacity
                        setTimeout(() => {
                            successView.classList.remove('opacity-0', 'scale-95');
                            successView.classList.add('opacity-100', 'scale-100');
                        }, 50);
                    }, 300); // Wait for fade out
                }, 800); // Simulated network delay
            });

            // Reset back to initial state (for demo purposes)
            btnReturn.addEventListener('click', () => {
                successView.classList.remove('opacity-100', 'scale-100');
                successView.classList.add('opacity-0', 'scale-95');
                
                setTimeout(() => {
                    successView.classList.add('hidden');
                    
                    // Reset Export Button
                    btnExport.innerHTML = 'Export Now';
                    btnExport.style.opacity = '1';
                    btnExport.disabled = false;
                    
                    exportView.classList.remove('hidden');
                    setTimeout(() => {
                        exportView.classList.remove('opacity-0', 'scale-95');
                        exportView.classList.add('opacity-100', 'scale-100');
                    }, 50);
                }, 300);
            });
        });
    </script>
</body></html>
