<style>
        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Custom input styling based on Design System */

            background-color: #eeedf3; /* surface-container mapping approximation for #F0EFEA */
            border: 1.5px solid transparent;
            transition: all 0.2s ease;
        }
        .glass-input:focus-within {
            background-color: #ffffff;
            border-color: #785600; /* primary */
        }
        
        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;

            width: 24px;

            background: #ffffff;
            border: 2px solid #785600;
            cursor: pointer;
            margin-top: -10px;

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;

            cursor: pointer;

            border-radius: 2px;

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- 
      Semantic Shell Logic: 
      Intent is "Transactional/Onboarding" (Budget Setup).
      Action: Suppress TopAppBar and BottomNavBar. Use a simplified contextual header.
    -->
<!-- Simplified Header for Setup Flow -->
<header class="flex items-center justify-between px-margin-mobile py-4 w-full max-w-2xl mx-auto sticky top-0 z-10 bg-background/80 backdrop-blur-md">
<button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Configure Budget</h1>
<button aria-label="Skip setup" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="font-label-md text-label-md">Skip</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile w-full max-w-2xl mx-auto pb-[120px] flex flex-col gap-stack-lg pt-4">
<!-- Header Text -->
<div class="flex flex-col gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-on-surface">Design your foundation</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Set your monthly income and we'll help structure a balanced allocation.</p>
</div>
<!-- Income Input Section -->
<div class="glass-input rounded-[16px] p-4 flex flex-col gap-1 relative overflow-hidden group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="monthlyIncome">Monthly After-Tax Income</label>
<div class="flex items-center">
<span class="font-data-lg text-data-lg text-on-surface mr-1">$</span>
<input class="font-data-lg text-data-lg text-on-surface bg-transparent border-none p-0 focus:ring-0 w-full outline-none" id="monthlyIncome" inputmode="numeric" placeholder="0.00" type="text" value="5,000"/>
</div>
<!-- Subtle decorative background element inside input -->
<div class="absolute -right-8 -bottom-8 w-24 h-24 bg-primary/5 rounded-full blur-xl group-focus-within:bg-primary/10 transition-colors pointer-events-none"></div>
</div>
<!-- Allocation Section -->
<div class="flex flex-col gap-stack-md mt-4">
<div class="flex items-end justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Allocation Strategy</h2>
<span class="font-label-md text-label-md text-primary bg-primary/10 px-2 py-1 rounded-md">Standard 50/30/20</span>
</div>
<!-- Visual Allocation Bar -->
<div class="w-full h-3 rounded-full flex overflow-hidden bg-surface-container">
<div class="bg-primary h-full transition-all duration-500 ease-out" id="barNeeds" style="width: 50%;"></div>
<div class="bg-tertiary h-full transition-all duration-500 ease-out" id="barWants" style="width: 30%;"></div>
<div class="bg-secondary h-full transition-all duration-500 ease-out" id="barSavings" style="width: 20%;"></div>
</div>
<div class="font-label-md text-label-md text-error hidden transition-opacity" id="allocationWarning">Total must equal 100%</div>
<!-- Bento Grid for Categories -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-base">
<!-- Needs Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-4 flex flex-col gap-4 shadow-[0_4px_12px_rgba(26,26,26,0.02)]">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Needs</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-50 text-[18px]">home</span>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface" id="amtNeeds">$2,500</div>
</div>
<div class="flex items-center gap-3 bg-surface-container/50 p-2 rounded-lg mt-auto border border-outline-variant/30">
<input class="flex-1" id="sliderNeeds" max="100" min="0" type="range" value="50"/>
<div class="flex items-center bg-surface-container-lowest rounded px-2 py-1 border border-outline-variant/50">
<input class="w-8 bg-transparent border-none p-0 text-center font-label-md text-label-md focus:ring-0 outline-none appearance-none m-0" id="inputNeeds" type="number" value="50"/>
<span class="font-label-md text-label-md text-on-surface-variant">%</span>
</div>
</div>
</div>
<!-- Wants Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-4 flex flex-col gap-4 shadow-[0_4px_12px_rgba(26,26,26,0.02)]">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-tertiary"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Wants</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-50 text-[18px]">local_cafe</span>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface" id="amtWants">$1,500</div>
</div>
<div class="flex items-center gap-3 bg-surface-container/50 p-2 rounded-lg mt-auto border border-outline-variant/30">
<input class="flex-1" id="sliderWants" max="100" min="0" type="range" value="30"/>
<div class="flex items-center bg-surface-container-lowest rounded px-2 py-1 border border-outline-variant/50">
<input class="w-8 bg-transparent border-none p-0 text-center font-label-md text-label-md focus:ring-0 outline-none appearance-none m-0" id="inputWants" type="number" value="30"/>
<span class="font-label-md text-label-md text-on-surface-variant">%</span>
</div>
</div>
</div>
<!-- Savings Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-4 flex flex-col gap-4 shadow-[0_4px_12px_rgba(26,26,26,0.02)]">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-secondary"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Savings</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-50 text-[18px]">account_balance</span>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface" id="amtSavings">$1,000</div>
</div>
<div class="flex items-center gap-3 bg-surface-container/50 p-2 rounded-lg mt-auto border border-outline-variant/30">
<input class="flex-1" id="sliderSavings" max="100" min="0" type="range" value="20"/>
<div class="flex items-center bg-surface-container-lowest rounded px-2 py-1 border border-outline-variant/50">
<input class="w-8 bg-transparent border-none p-0 text-center font-label-md text-label-md focus:ring-0 outline-none appearance-none m-0" id="inputSavings" type="number" value="20"/>
<span class="font-label-md text-label-md text-on-surface-variant">%</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-xl border-t-[0.5px] border-outline-variant p-4 pb-safe z-50 flex justify-center shadow-[0_-8px_24px_rgba(26,26,26,0.04)]">
<button class="w-full max-w-md bg-primary hover:bg-primary/90 text-on-primary h-14 rounded-[16px] font-label-md text-label-md tracking-widest uppercase transition-all duration-200 shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
            Confirm Allocation
            <span class="material-symbols-outlined text-[18px]">check</span>
</button>
</div>
<!-- Logic for dynamic updates -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const incomeInput = document.getElementById('monthlyIncome');
            
            const pInputs = {
                needs: document.getElementById('inputNeeds'),
                wants: document.getElementById('inputWants'),
                savings: document.getElementById('inputSavings')
            };
            
            const pSliders = {
                needs: document.getElementById('sliderNeeds'),
                wants: document.getElementById('sliderWants'),
                savings: document.getElementById('sliderSavings')
            };
            
            const displays = {
                needs: document.getElementById('amtNeeds'),
                wants: document.getElementById('amtWants'),
                savings: document.getElementById('amtSavings')
            };
            
            const bars = {
                needs: document.getElementById('barNeeds'),
                wants: document.getElementById('barWants'),
                savings: document.getElementById('barSavings')
            };

            const warning = document.getElementById('allocationWarning');

            // Format number with commas
            const formatCurrency = (num) => {
                return '$' + num.toLocaleString('en-US', { maximumFractionDigits: 0 });
            };

            // Parse currency string to number
            const parseCurrency = (str) => {
                return parseFloat(str.replace(/,/g, '') || 0);
            };

            // Format input while typing
            incomeInput.addEventListener('input', function(e) {
                let val = this.value.replace(/[^0-9.]/g, '');
                if(val) {
                    let num = parseFloat(val);
                    if(!isNaN(num)) {
                        // Keep cursor position roughly intact by not reformatting on every single keystroke if complex, 
                        // but for simplicity here we reformat on blur or just update amounts based on raw value.
                        // Let's update amounts immediately.
                    }
                }
                updateAmounts();
            });

            incomeInput.addEventListener('blur', function() {
                let num = parseCurrency(this.value);
                this.value = num.toLocaleString('en-US');
                updateAmounts();
            });

            function updateAmounts() {
                const totalIncome = parseCurrency(incomeInput.value);
                
                let n = parseInt(pInputs.needs.value) || 0;
                let w = parseInt(pInputs.wants.value) || 0;
                let s = parseInt(pInputs.savings.value) || 0;
                
                let total = n + w + s;
                
                if (total !== 100) {
                    warning.classList.remove('hidden');
                    warning.textContent = `Total allocation is ${total}%. It must equal 100%.`;
                } else {
                    warning.classList.add('hidden');
                }

                // Update text displays
                displays.needs.textContent = formatCurrency(totalIncome * (n / 100));
                displays.wants.textContent = formatCurrency(totalIncome * (w / 100));
                displays.savings.textContent = formatCurrency(totalIncome * (s / 100));

                // Update visual bars based on raw percentage, even if it exceeds 100 visually it will just clip
                let scale = total > 0 ? (100 / Math.max(100, total)) : 1;
                bars.needs.style.width = `${n * scale}%`;
                bars.wants.style.width = `${w * scale}%`;
                bars.savings.style.width = `${s * scale}%`;
            }

            // Sync sliders and number inputs
            ['needs', 'wants', 'savings'].forEach(cat => {
                pSliders[cat].addEventListener('input', (e) => {
                    pInputs[cat].value = e.target.value;
                    updateAmounts();
                });
                
                pInputs[cat].addEventListener('input', (e) => {
                    let val = parseInt(e.target.value) || 0;
                    if(val > 100) { val = 100; e.target.value = 100; }
                    pSliders[cat].value = val;
                    updateAmounts();
                });
            });

            // Initial calculation
            updateAmounts();
        });
    </script>
</body></html>
