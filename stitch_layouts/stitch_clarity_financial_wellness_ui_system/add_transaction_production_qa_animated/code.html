<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Clarity Financial - Transactions &amp; Transfers</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-secondary-fixed-variant": "#474746",
                    "on-background": "#1a1b1f",
                    "outline": "#817563",

                    "tertiary-fixed-dim": "#c7c7c3",
                    "surface-bright": "#faf9fe",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#464744",
                    "tertiary-container": "#747572",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#fffbff",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#f7bd48",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1a1b1f",

                    "outline-variant": "#d3c4af",
                    "surface-container-high": "#e9e7ed",
                    "tertiary": "#5b5c59",
                    "surface-container": "#eeedf3",
                    "inverse-surface": "#2f3034",
                    "surface-tint": "#7b5800",
                    "primary-fixed-dim": "#f7bd48",
                    "error": "#ba1a1a",
                    "surface-container-low": "#f4f3f8",
                    "primary": "#785600",
                    "secondary-fixed": "#e5e2e1",
                    "on-tertiary-container": "#fefcf8",

                    "error-container": "#ffdad6",

            "fontFamily": {

<style>
        body { font-family: 'Manrope', sans-serif; background-color: #F7F6F2; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined[data-weight="fill"] { font-variation-settings: 'FILL' 1; }
        .soft-shadow { box-shadow: 0 8px 24px rgba(26, 26, 26, 0.04); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Input overrides */
        input[type="text"], input[type="number"], input[type="date"] {
            background-color: #F0EFEA;
            border: none;
            border-radius: 12px;
            padding: 16px;
        }
        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus {
            background-color: #FFFFFF;
            border: 1.5px solid #B8860B;
            box-shadow: none;
            outline: none;
        }
        
        /* Tab switcher */
        .tab-btn { transition: all 0.2s ease-in-out; }
        .tab-btn.active { background-color: #ffffff; color: #1a1b1f; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; }
        .tab-btn.inactive { color: #5f5e5e; }
        
        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes staggerFadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animate-sheet {
            animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .animate-stagger-1 { animation: staggerFadeInUp 0.5s ease-out forwards; animation-delay: 0.1s; opacity: 0; }
        .animate-stagger-2 { animation: staggerFadeInUp 0.5s ease-out forwards; animation-delay: 0.2s; opacity: 0; }
        .animate-stagger-3 { animation: staggerFadeInUp 0.5s ease-out forwards; animation-delay: 0.3s; opacity: 0; }
        .animate-stagger-4 { animation: staggerFadeInUp 0.5s ease-out forwards; animation-delay: 0.4s; opacity: 0; }
        
        .btn-glow:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(120, 86, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background min-h-screen pb-24 md:pb-0">
<!-- TopAppBar for Linear Intent (Task-Focused) - No Bottom Nav Shell will be rendered here for mobile, but keeping structure for layout -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-50 transition-transform flex justify-between items-center px-margin-mobile py-4 max-w-7xl mx-auto border-b border-surface-container"><div class="flex items-center gap-4"><button class="p-2 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Add Transaction</h1></div><button class="p-2 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-primary">search</span></button></header>
<main class="max-w-3xl mx-auto px-margin-mobile pt-stack-md flex flex-col gap-stack-lg">
<!-- Add Transaction Form -->
<section class="bg-surface-container-lowest border border-surface-container rounded-xl p-6 soft-shadow animate-sheet">
<!-- Type Switcher -->
<div class="bg-surface-container p-1 rounded-lg flex mb-stack-lg">
<button class="tab-btn active flex-1 py-2 font-label-md text-label-md text-center cursor-pointer">Expense</button>
<button class="tab-btn inactive flex-1 py-2 font-label-md text-label-md text-center cursor-pointer">Income</button>
<button class="tab-btn inactive flex-1 py-2 font-label-md text-label-md text-center cursor-pointer">Transfer</button>
</div>
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center py-stack-md mb-stack-md animate-stagger-1"><label class="font-label-md text-label-md text-on-surface-variant mb-2">Amount</label><div class="flex items-center bg-surface-container-low rounded-xl px-6 py-4 focus-within:bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary transition-all"><span class="font-data-lg text-data-lg text-on-surface mr-1">$</span><input class="text-center font-display-lg text-display-lg bg-transparent border-none focus:ring-0 w-full p-0 text-on-surface" placeholder="0.00" type="number" value="125.50"/></div></div>
<!-- Form Fields -->
<div class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm animate-stagger-2"><label class="font-label-md text-label-md text-on-surface-variant ml-1">Merchant / Description</label><div class="relative w-full"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">storefront</span><input class="w-full pl-12 py-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all" placeholder="Whole Foods Market" type="text"/></div></div>
<div class="grid grid-cols-2 gap-gutter animate-stagger-3"><div class="flex flex-col gap-stack-sm"><label class="font-label-md text-label-md text-on-surface-variant ml-1">Category</label><div class="relative w-full"><span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">restaurant</span><select class="w-full pl-12 pr-10 py-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface appearance-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all"><option>Dining</option><option selected="">Groceries</option><option>Transport</option></select><span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span></div></div><div class="flex flex-col gap-stack-sm"><label class="font-label-md text-label-md text-on-surface-variant ml-1">Date</label><input class="w-full py-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all" type="date" value="2023-10-24"/></div></div>
<div class="flex flex-col gap-stack-sm animate-stagger-4"><label class="font-label-md text-label-md text-on-surface-variant ml-1">Account</label><div class="relative w-full bg-surface-container-low rounded-xl p-4 flex items-center justify-between cursor-pointer hover:bg-surface-container transition-colors border border-transparent hover:border-outline-variant"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center"><span class="material-symbols-outlined">account_balance</span></div><div><p class="font-body-md text-body-md text-on-surface">Chase Sapphire</p><p class="font-label-md text-label-md text-on-surface-variant">...4092</p></div></div><span class="material-symbols-outlined text-on-surface-variant">chevron_right</span></div></div>
<div class="flex items-center justify-between py-4 border-t border-surface-container mt-2">
<div>
<p class="font-body-md text-body-md text-on-surface">Recurring Transaction</p>
<p class="font-label-md text-label-md text-on-surface-variant text-[10px]">Repeat this expense</p>
</div>
<button class="w-12 h-6 bg-surface-variant rounded-full relative transition-colors duration-300">
<div class="w-5 h-5 bg-white rounded-full absolute left-0.5 top-0.5 shadow-sm transition-transform duration-300"></div>
</button>
</div>
</div>
<button class="btn-glow w-full mt-stack-lg bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl transition-all duration-300">
                Save Transaction
            </button>
</section>
</main>
</body></html>
